
x-backend-common: &backend-common
  image: daithien/socialbook-be:dev
  restart: unless-stopped
  expose:
    - '5000'
  env_file:
    - backend.env
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    chroma:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    container_name: socialbook-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - frontend

  backend1:
    <<: *backend-common
    container_name: socialbook-backend1

  backend2:
    <<: *backend-common
    container_name: socialbook-backend2

  frontend:
    image: daithien/socialbook-fe:dev
    container_name: socialbook-frontend
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - frontend.env
    depends_on:
      - backend1
      - backend2

  mongo:
    image: mongo:7
    container_name: socialbook-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    env_file:
      - mongo.env
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: socialbook-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: socialbook-chroma
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongo_data:
  redis_data:
  chroma_data:
